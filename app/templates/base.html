<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}File2link{% endblock %}</title>
  <meta name="theme-color" content="#0a0b10">
  <style>
    :root{--bg:#08090d;--panel:#11131b;--panel2:#171a25;--line:#292e3d;--text:#f5f7ff;--muted:#9299ad;--accent:#8b5cf6;--accent2:#22d3ee;--danger:#fb7185;--shadow:0 24px 80px #0008}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 15% -10%,#34206455,transparent 60%),radial-gradient(700px 500px at 100% 0,#07598533,transparent 55%),var(--bg);color:var(--text);font:15px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}.wrap{width:min(1120px,calc(100% - 36px));margin:auto}.nav{display:flex;justify-content:space-between;align-items:center;padding:24px 0}.brand{display:flex;gap:11px;align-items:center;font-weight:800;letter-spacing:-.5px}.brand-mark{width:38px;height:38px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 35px #8b5cf655;font-weight:900}.nav-links{display:flex;gap:18px;color:var(--muted);font-size:13px}.nav-links a:hover{color:#fff}.hero{padding:76px 0 62px;max-width:800px}.eyebrow{color:#c4b5fd;font-size:12px;text-transform:uppercase;letter-spacing:2px;font-weight:800}.hero h1{font-size:clamp(42px,7vw,82px);line-height:1.02;letter-spacing:-4px;margin:16px 0 22px}.gradient{background:linear-gradient(100deg,#fff,#b7a5ff 45%,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}.lead{color:var(--muted);font-size:18px;max-width:620px}.card{background:linear-gradient(145deg,#171a25dd,#0d0f16ee);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(18px)}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:13px;border:1px solid var(--line);background:#ffffff08;color:#fff;font-weight:750;cursor:pointer}.btn.primary{border-color:#8b5cf688;background:linear-gradient(135deg,#8b5cf6,#6366f1);box-shadow:0 10px 35px #6366f133}.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}.section{padding:22px 0 65px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stat{padding:24px}.stat strong{font-size:30px;display:block}.muted{color:var(--muted)}.footer{padding:30px 0;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}.topline{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.file-card{padding:28px}.file-name{font-size:clamp(24px,4vw,42px);letter-spacing:-1.5px;overflow-wrap:anywhere}.meta{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.pill{padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:#cbd5e1;background:#ffffff05;font-size:12px}.player{width:100%;max-height:70vh;background:#000;border-radius:16px;border:1px solid var(--line)}.notice{padding:14px 16px;border-radius:14px;background:#f59e0b12;border:1px solid #f59e0b33;color:#fcd34d}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:620px}.table th,.table td{text-align:left;padding:15px 18px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:#a5b4fc;font-size:11px;text-transform:uppercase;letter-spacing:1px}.input{width:100%;background:#0a0c12;border:1px solid var(--line);border-radius:12px;color:#fff;padding:12px 14px;outline:none}.input:focus{border-color:var(--accent)}.admin-shell{padding:25px 0 60px}.side-links{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.side-links a{padding:10px 14px;border:1px solid var(--line);border-radius:12px;color:var(--muted)}.side-links a:hover{color:#fff;border-color:var(--accent)}@media(max-width:760px){.wrap{width:min(100% - 24px,1120px)}.nav-links{display:none}.hero{padding:45px 0}.hero h1{letter-spacing:-2px}.grid{grid-template-columns:1fr}.card{border-radius:18px}}
  </style>
  {% block head %}{% endblock %}
</head>
<body><div class="wrap">
  <nav class="nav"><a class="brand" href="/"><span class="brand-mark">↗</span><span>File2link</span></a><div class="nav-links"><a href="/">Home</a><a href="/admin/">Admin</a></div></nav>
  {% block content %}{% endblock %}
  <footer class="footer">Fast Telegram media links · Built for simple sharing</footer>
</div></body></html>
